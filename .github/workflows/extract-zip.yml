name: Extract Ichi ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Ichi.zip
        run: |
          set -e

          echo "Extracting Ichi.zip..."

          rm -rf /tmp/ichi
          mkdir -p /tmp/ichi

          unzip -o Ichi.zip -d /tmp/ichi

          echo "Extracted files:"
          find /tmp/ichi -maxdepth 4 -print

          # Detect a single top-level directory
          TOP_COUNT=$(find /tmp/ichi -mindepth 1 -maxdepth 1 | wc -l)
          TOP_DIR=$(find /tmp/ichi -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ "$TOP_COUNT" -eq 1 ] && [ -n "$TOP_DIR" ]; then
            echo "Top-level folder detected: $TOP_DIR"
            cp -R "$TOP_DIR"/. .
          else
            cp -R /tmp/ichi/. .
          fi

      - name: Protect workflow files
        run: |
          set -e

          # Save all workflow files temporarily
          rm -rf /tmp/workflows
          mkdir -p /tmp/workflows

          if [ -d ".github/workflows" ]; then
            cp -R .github/workflows/. /tmp/workflows/
          fi

          # Remove workflow files from this commit
          rm -rf .github/workflows

      - name: Remove ZIP
        run: |
          rm -f Ichi.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Ichi project"
            git push
          fi

      - name: Restore workflow files
        run: |
          mkdir -p .github/workflows
          cp -R /tmp/workflows/. .github/workflows/

          echo "Workflow files restored locally."

      - name: Show final structure
        run: |
          echo "Project structure:"
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            | sort
