name: Train Note Detector (CPU, free runners)

# HZ CHORD AI - Note Detector Training
#
# Pipeline:
#
#   1. Generate synthetic arpeggio audio
#   2. Train the PyTorch note detector
#   3. Convert the trained model to LiteRT/TFLite
#   4. Copy the TFLite model into Android assets
#   5. Upload the trained model as a GitHub Actions artifact
#   6. Commit the updated TFLite model back to the repository
#
# GitHub-hosted runners are CPU-only, so this workflow is intended
# for automatic lightweight training and validation.
#
# The real/heavier training can still be performed using the
# Colab/self-hosted training pipeline.

on:
  push:
    branches:
      - main
    paths:
      - "training/note_detector/**"
      - ".github/workflows/train-note-detector-cpu.yml"

  workflow_dispatch:
    inputs:
      examples_per_combo:
        description: "Synthetic examples per (root, quality, direction) combo"
        required: false
        default: "5"

      epochs:
        description: "Training epochs"
        required: false
        default: "10"


jobs:
  train:
    runs-on: ubuntu-latest

    timeout-minutes: 300

    permissions:
      contents: write

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Python
      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # -------------------------------------------------------
      # Install PyTorch and training dependencies
      # -------------------------------------------------------
      - name: Install CPU-only torch and dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            torch \
            torchaudio \
            --index-url https://download.pytorch.org/whl/cpu

          python -m pip install \
            numpy \
            soundfile \
            pretty_midi


      # -------------------------------------------------------
      # Install current LiteRT Torch converter
      #
      # IMPORTANT:
      #
      # ai-edge-torch is deprecated.
      # The replacement package is litert-torch.
      # -------------------------------------------------------
      - name: Install LiteRT Torch
        run: |
          python -m pip install litert-torch


      # -------------------------------------------------------
      # Verify dependencies
      # -------------------------------------------------------
      - name: Verify training and conversion dependencies
        run: |
          python - <<'PY'
          import numpy
          import soundfile
          import torch
          import torchaudio
          import litert_torch

          print("NumPy:", numpy.__version__)
          print("SoundFile:", soundfile.__version__)
          print("PyTorch:", torch.__version__)
          print("TorchAudio:", torchaudio.__version__)
          print("LiteRT Torch:", getattr(litert_torch, "__version__", "installed"))

          print("Dependency check passed.")
          PY


      # -------------------------------------------------------
      # Generate synthetic dataset
      # -------------------------------------------------------
      - name: Generate synthetic dataset
        working-directory: training/note_detector
        env:
          EXAMPLES_PER_COMBO: ${{ github.event.inputs.examples_per_combo || '5' }}
        run: |
          python3 generate_synthetic_arpeggios.py \
            --output_dir data/arpeggios \
            --examples_per_combo "$EXAMPLES_PER_COMBO"


      # -------------------------------------------------------
      # Train PyTorch model
      # -------------------------------------------------------
      - name: Train
        working-directory: training/note_detector
        env:
          EPOCHS: ${{ github.event.inputs.epochs || '10' }}
        run: |
          python3 train.py \
            --data_dir data/arpeggios \
            --epochs "$EPOCHS" \
            --batch_size 32 \
            --output checkpoints/note_detector.pt \
            | tee training_run_log.txt


      # -------------------------------------------------------
      # Confirm checkpoint
      # -------------------------------------------------------
      - name: Confirm checkpoint
        run: |
          test -s training/note_detector/checkpoints/note_detector.pt
          echo "OK — PyTorch checkpoint exists."


      # -------------------------------------------------------
      # Convert PyTorch model to LiteRT/TFLite
      # -------------------------------------------------------
      - name: Export to TFLite
        working-directory: training/note_detector
        run: |
          python3 export_to_tflite.py \
            --checkpoint checkpoints/note_detector.pt \
            --output note_detector.tflite


      # -------------------------------------------------------
      # Confirm TFLite model
      # -------------------------------------------------------
      - name: Confirm TFLite model
        run: |
          test -s training/note_detector/note_detector.tflite

          echo "OK — TFLite model generated."

          ls -lh \
            training/note_detector/note_detector.tflite


      # -------------------------------------------------------
      # Copy TFLite model into Android project
      # -------------------------------------------------------
      - name: Copy model into Android assets
        run: |
          mkdir -p app/src/main/assets/models

          cp \
            training/note_detector/note_detector.tflite \
            app/src/main/assets/models/note_detector.tflite

          ls -lh \
            app/src/main/assets/models/note_detector.tflite


      # -------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------
      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: note-detector-model
          path: |
            training/note_detector/note_detector.tflite
            training/note_detector/checkpoints/note_detector.pt
            training/note_detector/training_run_log.txt


      # -------------------------------------------------------
      # Commit updated Android model
      # -------------------------------------------------------
      - name: Commit updated model, if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- app/src/main/assets/models/note_detector.tflite; then

            git add \
              app/src/main/assets/models/note_detector.tflite

            git commit \
              -m "Retrain note_detector (CPU, free runners) [automated] [skip ci]"

            git push

          else

            echo "No change in trained model — nothing to commit."

          fi
