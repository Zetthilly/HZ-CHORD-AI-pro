name: Train Note Detector (CPU, free runners)

# This one is REAL training, not a smoke test — but deliberately scaled down
# so it finishes on GitHub's free CPU-only runners in a reasonable time,
# since there's no GPU available here. Expect a weaker model than the same
# pipeline run on a GPU via colab_train_note_detector.ipynb with the larger
# default settings — this workflow trades some accuracy for "runs
# automatically on every push, for free, no Colab session needed."
#
# Use the workflow_dispatch inputs to run a bigger pass by hand when you
# want a stronger model without touching Colab (it'll just take longer).

on:
  push:
    branches: [main]
    paths:
      - 'training/note_detector/**'
      - '.github/workflows/train-note-detector-cpu.yml'
  workflow_dispatch:
    inputs:
      examples_per_combo:
        description: 'Synthetic examples per (root, quality, direction) combo'
        required: false
        default: '5'
      epochs:
        description: 'Training epochs'
        required: false
        default: '10'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # generous ceiling; CPU training of a small CNN on a few thousand short clips should finish well under this
    permissions:
      contents: write # needed to commit the trained model back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU-only torch + deps
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install pretty_midi soundfile numpy ai-edge-torch

      - name: Generate synthetic dataset
        working-directory: training/note_detector
        env:
          EXAMPLES_PER_COMBO: ${{ github.event.inputs.examples_per_combo || '5' }}
        run: python3 generate_synthetic_arpeggios.py --output_dir data/arpeggios --examples_per_combo "$EXAMPLES_PER_COMBO"

      - name: Train
        working-directory: training/note_detector
        env:
          EPOCHS: ${{ github.event.inputs.epochs || '10' }}
        run: python3 train.py --data_dir data/arpeggios --epochs "$EPOCHS" --batch_size 32 --output checkpoints/note_detector.pt | tee training_run_log.txt

      - name: Export to TFLite
        working-directory: training/note_detector
        run: python3 export_to_tflite.py --checkpoint checkpoints/note_detector.pt --output note_detector.tflite

      - name: Copy model into the Android project's assets
        run: |
          mkdir -p app/src/main/assets/models
          cp training/note_detector/note_detector.tflite app/src/main/assets/models/note_detector.tflite

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: note-detector-model
          path: |
            training/note_detector/note_detector.tflite
            training/note_detector/checkpoints/note_detector.pt
            training/note_detector/training_run_log.txt

      - name: Commit updated model, if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/assets/models/note_detector.tflite; then
            git add app/src/main/assets/models/note_detector.tflite
            git commit -m "Retrain note_detector (CPU, free runners) [automated] [skip ci]"
            git push
          else
            echo "No change in trained model — nothing to commit."
          fi
